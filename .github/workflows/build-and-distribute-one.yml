name: Build & Distribute Definitely One

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Manual release build'
      tester_groups:
        description: 'Firebase Tester Groups'
        required: false
        default: 'qa-testers'
  push:
    tags:
      - 'definitely-one@v*'
    paths:
      - 'apps/definitely-one/**'
      - 'packages/**'

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK via EAS
        id: build
        run: |
          cd apps/definitely-one/client
          npx eas-cli build --platform android --profile preview --non-interactive --wait

      - name: Download Build Artifact
        run: |
          cd apps/definitely-one/client
          npx eas-cli build:view --latest --json > build.json
          BUILD_URL=$(jq -r '.[0].artifacts.buildUrl // .artifacts.buildUrl' build.json)
          curl -L "$BUILD_URL" -o definitely-one.apk

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:919056358557:android:7534014df2fdb48179c874
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: ${{ github.event.inputs.tester_groups || 'qa-testers' }}
          file: apps/definitely-one/client/definitely-one.apk
          releaseNotes: ${{ github.event.inputs.release_notes || github.event.head_commit.message }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Definitely One ${{ github.ref_name }}
          files: apps/definitely-one/client/definitely-one.apk
          generate_release_notes: true
